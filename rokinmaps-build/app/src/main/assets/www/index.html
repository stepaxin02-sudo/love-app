<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="theme-color" content="#0b0f17" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Rokin Maps</title>
  <link href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>
  <div class="ambient"></div>
  <main class="shell">
    <section class="panel route-card" id="routeCard">
      <div class="brand-row">
        <div class="brand-mark">R</div>
        <div><div class="brand">Rokin Maps</div><div class="caption">Маршруты без лишнего</div></div>
        <button class="icon-btn mobile-only" id="collapseBtn" aria-label="Свернуть">⌄</button>
      </div>
      <div class="route-form">
        <div class="route-line">
          <span class="dot origin-dot"></span>
          <button class="place-field" id="originBtn"><span class="field-label">Откуда</span><span class="field-value muted" id="originText">Выберите точку</span></button>
          <button class="mini-btn" id="locateBtn" title="Моё местоположение">⌖</button>
        </div>
        <div class="route-divider"></div>
        <div class="route-line">
          <span class="dot destination-dot"></span>
          <button class="place-field" id="destinationBtn"><span class="field-label">Куда</span><span class="field-value muted" id="destinationText">Куда едем?</span></button>
          <button class="mini-btn" id="swapBtn" title="Поменять местами">⇅</button>
        </div>
      </div>
      <div class="modes" role="tablist">
        <button class="mode active" data-mode="car">🚗 <span>Авто</span></button>
        <button class="mode" data-mode="foot">🚶 <span>Пешком</span></button>
        <button class="mode" data-mode="bike">🚲 <span>Велосипед</span></button>
      </div>
      <div class="route-summary hidden" id="routeSummary">
        <div><div class="summary-main" id="durationText">—</div><div class="summary-sub" id="distanceText">—</div></div>
        <button class="start-btn" id="startBtn">Начать</button>
      </div>
      <div class="hint" id="hintText">Укажите начало и конец маршрута</div>
    </section>
    <section class="quick panel">
      <button id="centerBtn"><span>◎</span><small>Где я</small></button>
      <button id="zoomInBtn"><span>＋</span><small>Ближе</small></button>
      <button id="zoomOutBtn"><span>−</span><small>Дальше</small></button>
      <button id="clearBtn"><span>×</span><small>Сброс</small></button>
    </section>
    <div class="attribution-pill">© OpenStreetMap · OpenFreeMap</div>
  </main>
  <div class="modal-backdrop hidden" id="searchModal">
    <section class="search-sheet">
      <div class="sheet-handle"></div>
      <div class="search-head">
        <button class="back-btn" id="closeSearch">←</button>
        <div class="search-box"><span>⌕</span><input id="searchInput" autocomplete="off" placeholder="Адрес или место" /><button id="searchSubmit">Найти</button></div>
      </div>
      <div class="search-state" id="searchState">Введите адрес и нажмите «Найти»</div>
      <div class="results" id="results"></div>
    </section>
  </div>
  <div class="toast hidden" id="toast"></div>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js'"></script>
  <script src="app.js"></script>
</body>
</html>
