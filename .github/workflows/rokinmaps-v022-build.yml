name: Rokin Maps v0.2.2 Android Build

on:
  push:
    branches:
      - build/rokin-maps-v0.2.2

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        working-directory: rokinmaps-build
        run: gradle :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RokinMaps-Android-v0.2.2-unsigned
          path: rokinmaps-build/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
