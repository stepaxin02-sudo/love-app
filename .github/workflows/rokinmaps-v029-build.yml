name: Rokin Maps v0.2.9 Installable APK

on:
  push:
    branches:
      - build/rokin-maps-v0.2.9

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed debug APK
        working-directory: rokinmaps-build
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          APK="rokinmaps-build/app/build/outputs/apk/debug/app-debug.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare APK
        run: cp rokinmaps-build/app/build/outputs/apk/debug/app-debug.apk RokinMaps_Android_v0.2.9.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RokinMaps-Android-v0.2.9
          path: RokinMaps_Android_v0.2.9.apk
          if-no-files-found: error
